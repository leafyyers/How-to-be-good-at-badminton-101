<!DOCTYPE html>
<html>
<head>
    <title>account</title>
    <style>
        body {
            /* 1. Set up your background image */
            background-image: url('img/onepiece.jpg');
            
            /* 2. Ensure the image repeats cleanly as it moves */
            background-repeat: repeat; 
            
            /* 3. Match the image size (optional, but helps layout control) */
            background-size: auto; 
            
            /* 4. Apply the animation (Name | Duration | Speed Curve | Loop) */
            animation: moveBackground 20s linear infinite;
            
            /* Basic page setup */
            margin: 0;
            height: 100vh; 
        }

        /* 5. Define the movement rules */
        @keyframes moveBackground {
            from {
                background-position: 0 0;
            }
            to {
                background-position: -1000px 0; /* Moves the image horizontally left */
            }
        }
        
        /* Import a Minecraft-like pixelated font */
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Press Start 2P', monospace;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container designed to look like an in-game GUI menu */
        .gui-container {
            background-color: #C6C6C6;
            border: 4px solid #555555;
            border-top-color: #FFF;
            border-left-color: #FFF;
            border-bottom-color: #373737;
            border-right-color: #373737;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 0px rgba(0,0,0,0.5);
            z-index: 10; /* Ensures container stays above background */
        }

        h2 {
            font-size: 16px;
            color: #404040;
            text-align: center;
            text-shadow: 2px 2px 0px #E0E0E0;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 10px;
            color: #404040;
            margin-bottom: 8px;
            text-shadow: 1px 1px 0px #E0E0E0;
        }

        /* Inputs styled like Minecraft chat or anvil text fields */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #000000;
            border: 2px solid #555555;
            border-top-color: #373737;
            border-left-color: #373737;
            border-bottom-color: #FFFFFF;
            border-right-color: #FFFFFF;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: #E0E0E0;
            outline: none;
        }

        input:focus {
            border-color: #55FF55; /* Green highlight on selection */
        }

        /* The iconic Minecraft button style */
        .mc-button {
            width: 100%;
            padding: 15px;
            background-color: #4a4a4a;
            border: 3px solid #000000;
            border-top-color: #8b8b8b;
            border-left-color: #8b8b8b;
            border-bottom-color: #2e2e2e;
            border-right-color: #2e2e2e;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #E0E0E0;
            text-shadow: 2px 2px 0px #000000;
            cursor: pointer;
            margin-top: 10px;
        }

        .mc-button:hover {
            background-color: #707070;
            color: #FFFF55; /* Yellow text on hover */
            border-top-color: #b0b0b0;
            border-left-color: #b0b0b0;
            border-bottom-color: #3a3a3a;
            border-right-color: #3a3a3a;
        }

        .mc-button:active {
            border-top-color: #2e2e2e;
            border-left-color: #2e2e2e;
            border-bottom-color: #8b8b8b;
            border-right-color: #8b8b8b;
        }
    </style>
</head>
<body>


    <div class="gui-container">
        <h2>Create Account</h2>
        
        <form action="wow.html" method="GET">
            
            <!-- user Field -->
            <div class="input-group">
                <label for="user">Type user</label>
                <input type="text" id="user" name="user" placeholder="user" required>
            </div>

             <!-- Submit Button -->
            <button type="submit" class="mc-button">Play</button>
        </form>
    </div>

</body>
</html>
