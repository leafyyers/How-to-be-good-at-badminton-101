<body>
  <!-- Change 'https://google.com' to any website you want -->
   <a href="Angelo2game.html" target="_blank">
    <button type="button">Next game</button>
  </a>

    <!-- JavaScript Game Logic -->
    <script>
        const GRID_SIZE = 12;
        const ORIGINAL_WORDS = ["ONE PIECE", "COMPUTER", "TLE", "COACH", "BADMINTON", "RONALDO", "SEVEN"];
        
        // Convert to uppercase and strip whitespace for core tracking
        const WORDS_TO_FIND = ORIGINAL_WORDS.map(w => w.toUpperCase().replace(/\s+/g, ''));
        
        const WORD_DISPLAY_MAP = {};
        WORDS_TO_FIND.forEach((cleanWord, index) => {
            WORD_DISPLAY_MAP[cleanWord] = ORIGINAL_WORDS[index].toUpperCase();
        });

        let grid = [];
        let isSelecting = false;
        let startCell = null;
        let currentSelection = [];
        let foundWords = new Set();

        function initGame() {
            foundWords.clear();
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));
            
            placeWords();
            fillEmptyCells();
            renderUI();
        }

        function placeWords() {
            // Horizontal Right, Vertical Down, Diagonal Down-Right
            const directions = [[0, 1], [1, 0], [1, 1]];

            WORDS_TO_FIND.forEach(word => {
                let placed = false;
                let attempts = 0;
                
                while (!placed && attempts < 100) {
                    const [rd, cd] = directions[Math.floor(Math.random() * directions.length)];
                    const row = Math.floor(Math.random() * GRID_SIZE);
                    const col = Math.floor(Math.random() * GRID_SIZE);

                    if (canPlaceWord(word, row, col, rd, cd)) {
                        for (let i = 0; i < word.length; i++) {
                            grid[row + i * rd][col + i * cd] = word[i];
                        }
                        placed = true;
                    }
                    attempts++;
                }
            });
        }

        function canPlaceWord(word, row, col, rd, cd) {
            for (let i = 0; i < word.length; i++) {
                const r = row + i * rd;
                const c = col + i * cd;
                if (r >= GRID_SIZE || c >= GRID_SIZE || (grid[r][c] !== '' && grid[r][c] !== word[i])) {
                    return false;
                }
            }
            return true;
        }

        function fillEmptyCells() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
                    }
                }
            }
        }

        function renderUI() {
            const listElement = document.getElementById('word-list');
            listElement.innerHTML = WORDS_TO_FIND.map(w => 
                `<span class="word-item" id="word-${w}">${WORD_DISPLAY_MAP[w]}</span>`
            ).join('');

            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';
            
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.innerText = grid[r][c];
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.addEventListener('mousedown', () => startSelect(r, c, cell));
                    cell.addEventListener('mouseenter', () => trackSelect(r, c, cell));
                    
                    gridElement.appendChild(cell);
                }
            }
        }

        function startSelect(r, c, cell) {
            isSelecting = true;
            startCell = { r, c };
            currentSelection = [{ r, c, cell }];
            cell.classList.add('selected');
        }

        function trackSelect(r, c, cell) {
            if (!isSelecting) return;
            
            // Linear restriction check
            if (r === startCell.r || c === startCell.c || Math.abs(r - startCell.r) === Math.abs(c - startCell.c)) {
                if (!currentSelection.some(item => item.r === r && item.c === c)) {
                    currentSelection.push({ r, c, cell });
                    cell.classList.add('selected');
                }
            }
        }

        function endSelect() {
            if (!isSelecting) return;
            isSelecting = false;

            const selectedWord = currentSelection.map(item => grid[item.r][item.c]).join('');
            const reversedWord = selectedWord.split('').reverse().join('');

            let match = WORDS_TO_FIND.find(w => w === selectedWord || w === reversedWord);

            if (match && !foundWords.has(match)) {
                foundWords.add(match);
                document.getElementById(`word-${match}`).classList.add('found');
                currentSelection.forEach(item => item.cell.classList.add('found'));
                
                if (foundWords.size === WORDS_TO_FIND.length) {
                    setTimeout(() => alert("Congratulations! You found all the words! 🌟"), 200);
                }
            }
            document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));currentSelection = [];}window.addEventListener('mouseup', endSelect);document.getElementById('restart-btn').addEventListener('click', initGame);initGame();
    </script>
